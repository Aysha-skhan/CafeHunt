<!DOCTYPE html>
<html>
<head>
    <title>CafeHunt</title>
    <style>
    body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background: #f5f5f5;
    }
    h1 {
        color: #6f4e37;
    }
    .cafe-card {
        background: rgb(235, 131, 5);
        border-radius: 25px;
        padding: 16px;
        margin-bottom: 12px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .cafe-card h2 {
        margin: 0 0 8px 0;
        color: #333;
    }
    .cafe-card p {
        margin: 4px 0;
        color: #666;
    }
</style>
</head>
<body>
    <h1>CafeHunt</h1>
    <input id="location-input" type="text" placeholder="Enter lat, lng (e.g. 31.5186, 74.34589)">
    <button id="search-button">Search</button>
    <button id="location-button">📍 Use my location</button>
    <div id="results">Cafés will appear here.</div>
    <script>
    const button = document.getElementById("search-button");
    const input = document.getElementById("location-input");
    const locationButton = document.getElementById("location-button");

locationButton.addEventListener("click", () => {
    navigator.geolocation.getCurrentPosition(
        (position) => {
            searchCafes(position.coords.latitude, position.coords.longitude);
        },
        (error) => {
            container.innerHTML = "Couldn't get your location. Try typing it instead.";
        }
    );
});

    button.addEventListener("click", () => {
    const typed = input.value.trim();

    // GUARD 1: empty box
    if (typed === "") {
        container.innerHTML = "Please enter coordinates, e.g. 31.5186, 74.34589";
        return;
    }

    const parts = typed.split(",");

    // GUARD 2: must have exactly two parts (a lat and a lng)
    if (parts.length !== 2) {
        container.innerHTML = "Please enter both latitude and longitude, separated by a comma.";
        return;
    }

    const lat = parts[0].trim();
    const lng = parts[1].trim();

    // GUARD 3: both must be valid numbers
    if (isNaN(lat) || isNaN(lng) || lat === "" || lng === "") {
        container.innerHTML = "Latitude and longitude must be valid numbers.";
        return;
    }
    //happy path
    searchCafes(lat, lng);

});

const container = document.getElementById("results");

// THE SHARED FUNCTION — written once, called by both buttons
function searchCafes(lat, lng) {
    container.innerHTML = "🔍 Finding cafés near you...";
    fetch(`/search/?lat=${lat}&lng=${lng}`)
        .then(response => response.json())
        .then(data => {
            container.innerHTML = "";
            data.forEach(cafe => {
                container.innerHTML += `
                    <div class="cafe-card">
                        <h2>${cafe.name}</h2>
                        <p>${cafe.address}</p>
                        <p>Rating: ${cafe.rating}</p>
                        <p>${cafe.distance} km away — ${cafe.duration_min} min by car</p>
                    </div>
                `;
            });
        });
}

</script>
</body>
</html>
